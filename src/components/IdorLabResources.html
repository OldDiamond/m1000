<div class="idor-resources-track">

    <div class="idor-resource-brand"><img src="/assets/brand/northline-mark.svg" width="28" height="28" alt="" loading="lazy" decoding="async"><p><strong>Northline Billing</strong></p></div>
    {{resourceDifficulty}}

    <nav aria-label="Northline Billing resources">
