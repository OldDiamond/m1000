<dialog class="idor-credentials-dialog" id="idor-credentials-dialog" aria-labelledby="idor-credentials-title" aria-describedby="idor-credentials-description">
  <div class="idor-credentials-header">
    <h2 id="idor-credentials-title" data-toc-exclude data-no-reveal>Demo credentials</h2>
    <button class="idor-credentials-close" type="button" aria-label="Close demo credentials" autofocus><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
  </div>
  <p id="idor-credentials-description">Public training accounts for Northline Billing.</p>
  <div class="idor-credentials-accounts">{{demoAccounts}}</div>
  <p class="idor-credentials-status" role="status" aria-live="polite" aria-atomic="true"></p>
</dialog>
