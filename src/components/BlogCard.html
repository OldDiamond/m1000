<a class="framer-6Ku2B blog-preview-card" href="{{postUrl}}" target="_blank" rel="noopener noreferrer" aria-label="Read {{postTitle}} on Medium (opens in a new tab)">
  <div data-framer-name="Image">
    <img src="{{postImage}}" width="{{imageWidth}}" height="{{imageHeight}}" alt="{{imageAlt}}" loading="lazy" decoding="async">
  </div>
  <div data-framer-name="Content">
    <div data-framer-name="Title &amp; Date">
      <p class="blog-card-date"><time datetime="{{postDate}}">{{postDisplayDate}}</time> · Medium</p>
      <h3>{{postTitle}}</h3>
    </div>
    <p class="blog-card-excerpt">{{postExcerpt}}</p>
  </div>
</a>
