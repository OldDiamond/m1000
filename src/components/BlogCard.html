<a class="framer-6Ku2B blog-preview-card blog-card" href="{{postUrl}}" aria-label="Read {{postTitle}}">
  <div class="blog-card-media" data-framer-name="Image">
    <img src="{{postImage}}" width="{{imageWidth}}" height="{{imageHeight}}" alt="{{imageAlt}}" style="object-fit:{{postImageFit}}" loading="lazy" decoding="async">
  </div>
  <div class="blog-card-content" data-framer-name="Content">
    {{postCategoryLine}}
    <div class="blog-card-heading" data-framer-name="Title &amp; Date">
      <p class="blog-card-date"><time datetime="{{postDate}}">{{postDisplayDate}}</time><span aria-hidden="true"> · </span><span>{{readingMinutes}} min read</span></p>
      <h3>{{postTitle}}</h3>
    </div>
    <p class="blog-card-excerpt">{{postExcerpt}}</p>
    {{postCves}}
    <span class="blog-card-read">Read article <span aria-hidden="true">↗</span></span>
  </div>
</a>
