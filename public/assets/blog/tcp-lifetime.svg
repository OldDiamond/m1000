 <g font-family="Arial,sans-serif"><text x="64" y="73" fill="#8fb4e3" font-size="18" letter-spacing="4">M1000Z / VULNERABILITY RESEARCH</text><text x="64" y="142" fill="#edf0ed" font-size="44" font-weight="700">Before the first HTTP request</text><text x="64" y="181" fill="#a5adb3" font-size="21">TCP · IPv4 · shared state</text></g>
