<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
 <title id="title">TCP connection state and memory lifetime</title><desc id="desc">An original conceptual network diagram showing an IPv4 listener, request state, child state and a concurrent reader.</desc>
