 <g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#edf0ed" font-size="24" font-weight="700"><text x="137" y="337">SYN</text><text x="390" y="337">Listener</text><text x="675" y="337">Request state</text><text x="1003" y="337">Child state</text></g><g fill="#a5adb3" font-size="16"><text x="137" y="369">IPv4 options</text><text x="390" y="369">TCP handshake</text><text x="675" y="369">Shared option memory</text><text x="1003" y="369">Ownership changes</text><text x="532" y="220" fill="#8fb4e3">Concurrent reader</text></g></g>
