 <g font-family="Arial,sans-serif"><text x="64" y="548" fill="#edf0ed" font-size="23">Request-owned memory must not outlive its owner.</text><text x="64" y="588" fill="#8fb4e3" font-size="16" letter-spacing="3">INITIALIZE / FAIL SAFELY / RESET</text><text x="1136" y="588" fill="#a5adb3" font-size="14" text-anchor="end">Conceptual illustration</text></g>
